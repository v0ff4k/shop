; Supervisor конфигурация для worker процессов
; Автоматически запускается через entrypoint.sh

[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=false
logfile=/var/www/shop/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:shop_worker_async]
command=php /var/www/shop/bin/console messenger:consume async --limit=1000 --memory-limit=128M --time-limit=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
directory=/var/www/shop
environment=APP_ENV="%(ENV_APP_ENV)s"
stdout_logfile=/var/www/shop/var/log/worker_async_%(process_num)02d.log
stderr_logfile=/var/www/shop/var/log/worker_async_%(process_num)02d_error.log
redirect_stderr=false

[program:shop_worker_email]
