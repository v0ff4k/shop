# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    handle_all_throwables: true
    http_method_override: false
    php_errors:
        log: true

    # Note: session will be enabled only for web controllers
    # API controllers are stateless
    session:
        handler_id: null
        cookie_secure: false
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        cookie_httponly: true
        cookie_lifetime: 3600

    router:
        utf8: true

    serializer:
        enable_attributes: true

    # HTTP Cache configuration (временно отключено)
    # http_cache:
    #     enabled: true
    #     trace_level: full
