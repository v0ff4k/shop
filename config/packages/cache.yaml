# config/packages/cache.yaml
framework:
    cache:
        app: cache.adapter.redis
        default_redis_provider: 'redis://%env(REDIS_HOST)%:%env(REDIS_PORT)%'
        system: cache.adapter.filesystem

        pools:
            cache.doctrine.result:
                adapter: cache.app
            cache.doctrine.system:
                adapter: cache.system
            cache.prometheus:
                adapter: cache.app
            cache.elasticsearch:
                adapter: cache.app
